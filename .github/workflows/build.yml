name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conda-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-update-conda: false
          conda-remove-defaults: true

      - name: Install conda-build
        run: conda install -y -n base conda-build anaconda-client

      - name: Build and test
        if: runner.os != 'Windows'
        run: |
          conda build recipe -c conda-forge --override-channels \
            --output-folder "${GITHUB_WORKSPACE}/build_artifacts"

      # conda-build must not run from Git Bash on Windows (POSIX paths end up in its .bat wrapper)
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd /C CALL {0}
        run: >
          conda build recipe -c conda-forge --override-channels
          --output-folder "%GITHUB_WORKSPACE%\build_artifacts"

      - uses: actions/upload-artifact@v4
        with:
          name: upx-${{ matrix.os }}
          path: build_artifacts/**/upx-*.conda
          if-no-files-found: error

      # only on push to main and only if ANACONDA_TOKEN secret is set
      - name: Upload to Anaconda.org
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANACONDA_TOKEN != '' && runner.os != 'Windows'
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          anaconda -t "${ANACONDA_TOKEN}" upload --skip-existing \
            build_artifacts/*/upx-*.conda

      - name: Upload to Anaconda.org (Windows)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANACONDA_TOKEN != '' && runner.os == 'Windows'
        shell: cmd /C CALL {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: >
          for %%f in (build_artifacts\win-64\upx-*.conda) do
          anaconda -t "%ANACONDA_TOKEN%" upload --skip-existing "%%f"
