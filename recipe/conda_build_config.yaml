# mirrors conda-forge-pinning
c_compiler:
  - gcc                        # [linux]
  - clang                      # [osx]
  - vs2022                     # [win]
cxx_compiler:
  - gxx                        # [linux]
  - clangxx                    # [osx]
  - vs2022                     # [win]
c_compiler_version:            # [unix]
  - 15                         # [linux]
  - 21                         # [osx]
cxx_compiler_version:          # [unix]
  - 15                         # [linux]
  - 21                         # [osx]
c_stdlib:
  - sysroot                    # [linux]
  - macosx_deployment_target   # [osx]
  - vs                         # [win]
c_stdlib_version:              # [unix]
  - 2.17                       # [linux]
  - 11.0                       # [osx]
